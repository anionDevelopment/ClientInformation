[extend]
useDefault = true

[[allowlists]]
description = "Local development-CA and the certificate which is issued by it. Both are generated by the build, are git-ignored and are only valid for the local test-domain, so they never leave the machine of the developer. A real deployment gets its own certificate. The certificate exists more than once because the build copies it from the repository into every codeunit which embeds it."
paths = [
    '''Other/Resources/CA/''',
    '''Other/Resources/DevelopmentCertificate/''',
]
