# Known false positives of the secret-scan of the built OCI-images. Every regex is matched against the description of a finding.

[[ignoredfindings]]
description = "Private key of the development-certificate. It is only valid for the local test-domain 'clientinformation.test.local', is issued by the local development-CA and is not a secret of a real deployment (the same certificate is embedded in the backend as development-certificate anyway). A real deployment gets its own certificate."
regexes = [
    '''^file "Workspace/Other/Certificates/ClientInformationDevelopmentCertificate\.key" in image-layer: contains a private key$''',
]
